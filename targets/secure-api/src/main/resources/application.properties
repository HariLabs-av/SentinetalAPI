spring.application.name=sentinelapi-secure-api
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sentinelapi_secure_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local-demo defaults only. Supply JWT_SECRET as an environment variable outside the sandbox.
sentinelapi.jwt.secret=${JWT_SECRET:c2VudGluZWxhcGktc2VjdXJlLWRlbW8tc2VjcmV0LWtleS0wMTIzNDU2Nzg5MGFiY2RlZg==}
sentinelapi.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
