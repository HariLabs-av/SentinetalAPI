spring.application.name=sentinelapi-vulnerable-api
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sentinelapi_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Demo-only JWT secret. Replace with an environment variable for anything beyond this local sandbox.
sentinelapi.jwt.secret=${JWT_SECRET:c2VudGluZWxhcGktZGVtby1zZWNyZXQta2V5LTAxMjM0NTY3ODkwYWJjZGVm}
sentinelapi.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
